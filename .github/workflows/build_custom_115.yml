name: Personal 115 Build

on:
  push:
    branches: [custom/115]
  pull_request:
    branches: [custom/115]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-115-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.28.11"
          run_install: false

      - name: Start isolated Aria2 for upstream RPC tests
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          mkdir -p "$RUNNER_TEMP/aria2"
          aria2c --enable-rpc=true --rpc-listen-all=false --daemon=true \
            --dir="$RUNNER_TEMP/aria2" --pause=true \
            --enable-dht=false --enable-dht6=false --enable-peer-exchange=false

      - name: Check build input validation
        run: python3 -B -m unittest discover -s tests -p 'test_custom_115_build.py' -v

      - name: Run backend tests
        run: go test ./... -timeout=180s

      - name: Check 115 concurrency
        run: go test -race ./drivers/115_open/... ./internal/offline_download/... ./internal/db/... ./server/handles/... ./server/common/... -timeout=180s

      - name: Build with pinned personal frontend
        run: |
          bash build-custom-115.sh
          bin/openlist version
          test "$(git status --porcelain --untracked-files=normal)" = ""

      - name: Upload binary and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openlist-custom-115-linux-amd64-${{ github.sha }}
          path: |
            bin/openlist
            bin/openlist.build-info
            bin/openlist.sha256
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build personal image
        run: bash build-custom-115.sh --docker

      - name: Check image version
        run: docker run --rm --entrypoint /entrypoint.sh openlist:custom-115 version
